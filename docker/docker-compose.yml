version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: roommate-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roommate_bumble
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roommate_bumble"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: roommate-redis
    restart: always
    ports:
      - "6379:6379"

  ml-service:
    build:
      context: ../
      dockerfile: docker/ml-service.Dockerfile
    container_name: roommate-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ../ml-service:/app

  server:
    build:
      context: ../
      dockerfile: docker/server.Dockerfile
    container_name: roommate-server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ../server/.env
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/roommate_bumble?schema=public
      - ML_SERVICE_URL=http://ml-service:8000
      - CLIENT_URL=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../server:/app
      - /app/node_modules

  client:
    build:
      context: ../
      dockerfile: docker/client.Dockerfile
    container_name: roommate-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - server
    volumes:
      - ../client:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
